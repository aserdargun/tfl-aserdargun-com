    <div id="root"></div>
    <noscript>
      <main>
        <h1>TFL — Token Flow Laboratory</h1>
        <p>
          An interactive, deterministic simulation of how a language-model
          serving system carries one request from prompt to next token.
          Everything runs in your browser as a teaching model.
        </p>
        <p>
          <strong>Scope:</strong> timings, capacities and token text are
          synthetic. No model, neural network or inference engine runs here, no
          hardware benchmark is executed, and tokenization is illustrative.
          Time-to-first-token is calculated from simulated events, not measured
          latency.
        </p>
        <h2>What it covers</h2>
        <ul>
          <li>
            Queueing, prefill, KV-cache reservations, decode steps and token
            delivery.
          </li>
          <li>
            Nine experiments: one request, load storm, steady arrivals, 32K
            context, code generation, many short users, KV wall, overload and
            batching trade-off.
          </li>
          <li>Ten guided checkpoints in Token Flow 101.</li>
          <li>
            Assumptions and evidence shown beside every result, so a simulated
            number is never read as a measurement.
          </li>
        </ul>
      </main>
    </noscript>
