<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="TFL — Token Flow Laboratory">
  <title>TFL — Token Flow Laboratory</title>
  <rect width="320" height="320" rx="64" fill="#121310"/>
  <circle cx="160" cy="142" r="108" fill="#c8ff36"/>
  <g fill="#0c0d0a" aria-hidden="true">
    <!-- queue/source bracket on the left -->
    <rect x="74" y="118" width="14" height="48" rx="3"/>
    <!-- three bold tokens along a right-pointing flow -->
    <rect x="104" y="124" width="28" height="36" rx="6"/>
    <rect x="146" y="124" width="28" height="36" rx="6"/>
    <rect x="188" y="124" width="28" height="36" rx="6"/>
    <!-- arrow head: triangle pointing right at end of token stream -->
    <polygon points="232,142 232,114 260,142 232,170 232,142"/>
  </g>
  <text x="160" y="296" text-anchor="middle" fill="#c8ff36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-2">TFL</text>
</svg>
